'c/confirmacao':()=>{const r=V('recibo',{id:'BV1234',met:'Multicaixa Express',total:27500,data:hoje()});return[shell('c','Confirmação',`<div class="${CARD} max-w-md mx-auto p-8 text-center space-y-4"><div class="mx-auto w-20 h-20 rounded-full bg-accent text-white grid place-items-center text-4xl">✓</div><h2 class="text-2xl font-extrabold text-brand">Pagamento realizado!</h2><p class="text-slate-500 text-sm">A sua carga está a caminho.</p><div class="rounded-xl bg-soft p-4"><div class="text-sm text-slate-500">Recibo da viagem #${r.id}</div><div class="text-3xl font-extrabold text-brand">${kz(r.total)}</div><div class="text-xs text-slate-500">${r.data} · ${r.met}</div></div><a href="#/c/historico" class="${BTN}">Ver detalhes</a><a href="#/c/solicitar" class="${BTN2}">Voltar ao início</a></div>`,{active:'c/solicitar'})]},

'm/pedidos':()=>[shell('m','Pedidos disponíveis',`<div id="tb" ${TABS}></div><div id="lista" class="grid md:grid-cols-2 gap-4"></div>`,{active:'m/pedidos'}),()=>{const dr=f=>{const n=V('negados',[]),l=PED.filter(p=>!n.includes(p.id)&&(!f||(f=='u'?p.u:p.k<=15)));$('#lista').innerHTML=l.map(p=>`<div class="${CARD} overflow-hidden"><img src="${IMG}" class="h-32 w-full object-cover bg-slate-200"><div class="p-4 space-y-2"><div class="flex justify-between"><b class="text-brand">${p.r}</b><span class="text-sm text-slate-500">${p.u?'<span class="text-red-600 font-bold">Urgente</span> · ':''}${p.k} km</span></div><div class="text-sm text-slate-500">${p.c} · ${p.w} kg · ${p.cl}</div><div class="text-xl font-extrabold text-brand">${kz(p.v)}</div><div class="flex gap-2"><button data-a="${p.id}" class="flex-1 rounded-xl bg-accent py-2 font-bold text-white">Aceitar</button><button data-n="${p.id}" class="${BTNR} flex-1">Negar</button></div></div></div>`).join('')||'<p class="text-slate-500">Sem pedidos neste momento.</p>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.s('pedAtual',+b.dataset.a);go('m/preco')});document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.s('negados',[...V('negados',[]),+b.dataset.n]);toast('Pedido recusado');dr(f)})};tabs('tb',[['Todos',''],['Urgentes','u'],['Próximos','p']],dr)}],
'm/preco':()=>{const p=PED.find(x=>x.id==V('pedAtual',0));if(!p)return[``,()=>go('m/pedidos')];return[shell('m','Detalhes da carga',`<div class="grid lg:grid-cols-2 gap-6"><img src="${IMG}" class="rounded-2xl w-full h-64 lg:h-full object-cover bg-slate-200"><div class="${CARD} p-5 space-y-3"><h2 class="text-xl font-extrabold text-brand">${p.c}</h2><div class="text-sm text-slate-500">${p.r} · ${p.w} kg · 1 volume · ${p.k} km</div><div class="flex justify-between"><span class="text-slate-500">Preço sugerido</span><b class="text-xl text-brand">${kz(p.v)}</b></div><label class="block text-sm font-semibold text-slate-500">A sua proposta (Kz)<input id="valor" type="number" min="1" value="${p.v}" class="${INP} mt-1"></label><p id="erro" class="text-sm font-semibold text-red-600"></p><button id="env" class="${BTN}">Enviar proposta</button></div></div>`,{back:'m/pedidos',active:'m/pedidos'}),()=>{$('#env').onclick=()=>{const v=+$('#valor').value;if(!(v>0))return $('#erro').textContent='Indique um valor válido.';S.s('propostas',[{id:'BV'+(2000+V('propostas',[]).length+1),r:p.r,valor:v,data:hoje(),estado:'Enviada',cl:p.cl},...V('propostas',[])]);S.s('negados',[...V('negados',[]),p.id]);S.s('aceite',0);go('m/enviada')}}]},
'm/enviada':()=>{const l=V('propostas',[]),a=V('aceite',0);return[shell('m','Notificação',`<div class="max-w-md mx-auto space-y-4"><div class="${CARD} p-6 text-center space-y-3"><div class="mx-auto w-16 h-16 rounded-full bg-soft text-accent grid place-items-center text-3xl">✓</div><h2 class="text-xl font-extrabold text-brand">Proposta enviada!</h2><p class="text-sm text-slate-500">Aguarde a resposta do cliente.</p><a href="#/m/pedidos" class="${BTN}">Ver pedidos</a></div><div class="${CARD} p-6 text-center space-y-3">${a?`<h2 class="text-lg font-extrabold text-brand">Cliente aceitou a sua proposta!</h2><p class="text-sm text-slate-500">Inicie a viagem quando estiver pronto.</p><a href="#/m/mapa" class="${BTN}">Iniciar viagem</a>`:`<p class="text-sm text-slate-500">Modo demonstração: simule a resposta do cliente.</p><button id="sim" class="${BTN2}">Simular resposta do cliente</button>`}</div></div>`,{active:'m/pedidos'}),()=>{const b=$('#sim');b&&(b.onclick=()=>{S.s('aceite',1);const x=V('propostas',[]);x[0]&&(x[0].estado='Em curso');S.s('propostas',x);render()})}]},
'm/mapa':()=>[shell('m','A caminho da recolha',`<div class="grid lg:grid-cols-5 gap-6"><div id="map" class="lg:col-span-3 h-80 lg:h-[600px]"></div><div class="lg:col-span-2 space-y-4"><div class="${CARD} p-4 flex items-center gap-3"><img src="${av(47)}" class="w-14 h-14 rounded-full"><div class="flex-1"><b class="text-brand">Ana Manuel</b><div class="text-sm text-slate-500">Luanda, Maianga</div></div><span class="text-sm font-bold text-accent" id="eta">10 min</span></div><button id="nav" class="${BTN}">Iniciar navegação</button><a href="#/m/imagem" class="${BTN2}">Ver mercadoria</a></div></div>`,{active:'m/mapa'}),()=>{const a=[-8.839,13.289],b=[-8.9,13.25];mapa([{c:b,t:'Você',k:'#0a6d5c'},{c:a,t:'Cliente',k:'#dc2626'}],[b,a],12);$('#nav').onclick=()=>{$('#nav').textContent='A navegar...';let i=0;const mk=L.marker(b,{icon:pin('#2563eb')}).addTo(MAP);TM=setInterval(()=>{i+=.04;mk.setLatLng([b[0]+(a[0]-b[0])*i,b[1]+(a[1]-b[1])*i]);$('#eta').textContent=Math.max(0,Math.round(10*(1-i)))+' min';if(i>=1){clearInterval(TM);toast('Chegou à recolha');$('#nav').textContent='Chegou'}},500)}}],
'm/imagem':()=>[shell('m','Imagem da mercadoria',`<div class="max-w-2xl space-y-4"><div class="${CARD} overflow-hidden"><img src="${IMG}" class="w-full h-72 object-cover bg-slate-200"><div class="p-4"><b class="text-brand">Mercadoria comercial · 50 kg</b><div class="mt-2 inline-block rounded-full bg-emerald-100 px-3 py-1 text-xs font-bold text-emerald-800">Cliente enviou imagem da carga</div></div></div><a href="#/m/pagamento" class="${BTN}">Concluir entrega</a><a href="#/m/mapa" class="${BTN2}">Voltar ao mapa</a></div>`,{back:'m/mapa',active:'m/mapa'})],
'm/pagamento':()=>{const r=V('propostas',[]).find(x=>x.estado=='Em curso')||{};return[shell('m','Receber pagamento',`<div class="${CARD} max-w-md mx-auto p-8 text-center space-y-4"><div class="mx-auto w-20 h-20 rounded-full bg-accent text-white grid place-items-center text-4xl">✓</div><h2 class="text-2xl font-extrabold text-brand">Você recebeu o pagamento!</h2><div class="text-4xl font-extrabold text-brand">${kz(r.valor||22000)}</div><div class="rounded-xl bg-soft p-3 text-sm text-slate-500">Viagem #${r.id||'BV1234'} · ${hoje()}</div><a href="#/m/ganhos" id="fim" class="${BTN}">Ver detalhes</a><a href="#/m/pedidos" class="${BTN2}">Voltar ao início</a></div>`,{active:'m/ganhos'}),()=>{const x=V('propostas',[]),p=x.find(y=>y.estado=='Em curso');if(p){p.estado='Concluída';S.s('propostas',x)}}]},
'm/ganhos':()=>{const l=V('propostas',[]).filter(x=>x.estado=='Concluída');return[shell('m','Ganhos',`<div class="${CARD} p-6 max-w-md mb-6"><div class="text-sm text-slate-500">Total recebido</div><div class="text-4xl font-extrabold text-brand">${kz(l.reduce((a,x)=>a+x.valor,0))}</div></div><div class="grid md:grid-cols-2 gap-4">${l.map(x=>`<div class="${CARD} p-4 flex justify-between"><div><b class="text-brand">${x.r}</b><div class="text-sm text-slate-500">#${x.id} · ${x.data}</div></div><b class="text-brand">${kz(x.valor)}</b></div>`).join('')}</div>`,{active:'m/ganhos'})]},
'm/perfil':()=>[shell('m','Perfil do mercador',`<div class="${CARD} max-w-md p-6 space-y-4"><div class="flex items-center gap-4"><img src="${av(12)}" class="w-20 h-20 rounded-full"><div><b class="text-xl text-brand">${ses.nome}</b><div class="text-sm text-slate-500">★ 4.8 (120) · <span class="text-accent font-bold">Online</span></div></div></div><div class="rounded-xl bg-soft p-4 text-sm"><div class="text-slate-500">Veículo</div><b>Camião médio · KZ 70-12-AB</b></div><div class="flex justify-between rounded-xl bg-soft p-4"><span>Documentos</span><b class="text-accent">Aprovados</b></div><div class="flex justify-between rounded-xl bg-soft p-4"><span>Viagens concluídas</span><b>${V('propostas',[]).filter(x=>x.estado=='Concluída').length}</b></div><a href="#/m/ganhos" class="${BTN2}">Ver ganhos</a><button id="sair" class="${BTNR}">Terminar sessão</button></div>`,{active:'m/perfil'})]};
function render(){if(!ses)return;const r=location.hash.slice(2)||(ses.tipo=='cliente'?'c/solicitar':'m/pedidos');if(r[0]!=ses.tipo[0])return go(ses.tipo=='cliente'?'c/solicitar':'m/pedidos');const R=ROUTES[r];if(!R)return go(r[0]+'/'+(r[0]=='c'?'solicitar':'pedidos'));const [h,init]=R();document.getElementById('app').innerHTML=h;window.scrollTo(0,0);init&&init();const s=$('#sair');s&&(s.onclick=()=>{localStorage.removeItem('bv_sessao');location.href='index.html'})}
addEventListener('hashchange',render);render();
</script></body></html>
